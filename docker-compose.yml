services:
  api:
    build:
      context: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      PORT: 3000
    volumes:
      - /etc/product-api/tls:/certs:ro
    restart: unless-stopped
    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges

    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m